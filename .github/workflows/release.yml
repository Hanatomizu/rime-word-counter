# 发布流水线：把「CLI 二进制」和「Tauri 桌面端安装包」一起打进同一个 GitHub Release。
#
# 触发方式：
#   * 推送形如 v1.1.0 的 tag（自动识别版本号，此路径是唯一的正式发布入口）
#   * 手动 workflow_dispatch（只跑打包，产物留在 Actions artifacts，不发 Release）
#
# 产物矩阵：
#   CLI（无图形依赖，6 个目标三元组，用 dist profile 构建）
#     x86_64 / aarch64 × Linux(gnu) / macOS(darwin) / Windows(msi)
#   桌面端（Tauri 2，必须在对应系统上原生打包）
#     Linux x86_64  → .deb + .AppImage（Ubuntu 24.04，glibc ≥ 2.39）
#     Linux aarch64 → .deb + .AppImage（ubuntu-24.04-arm）
#     macOS arm64   → .dmg（未签名）
#     Windows x64   → .msi + .exe (NSIS)（未签名）
#
# 说明：
#   * 本文件是**手写维护**的，不再由 cargo-dist 生成；改动 dist 配置后不要执行 `dist init`，
#     否则会覆盖此文件（详见 dist-workspace.toml 顶部注释）。
#   * macOS / Windows 产物未做代码签名与公证，用户首次运行需要手动放行，Release 说明里已注明。

name: Release

on:
  push:
    tags:
      # 匹配 v1.1.0 / 1.1.0 / v1.1.0-beta.1 等；具体格式由 versioning 任务做严格校验
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "只打包不发 Release 时使用的版本号（留空则取 Cargo.toml 里的版本）"
        required: false
        type: string

# 同一版本重复推送时，取消尚未完成的旧运行，避免并发上传同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CLI_BIN: rime-word-counter

jobs:
  # ── 1. 校验 tag 与各清单里的版本号是否一致 ─────────────────────────────
  # 版本号不一致会导致「安装包显示 1.1.0、CLI 显示 1.0.0」这类问题，所以先卡住。
  versioning:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 解析版本号
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            publish=true
          else
            version="$INPUT_VERSION"
            # 手动触发只打包，产物留在 Actions artifacts，不创建 Release
            publish=false
            if [ -z "$version" ]; then
              version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            fi
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::无法识别的版本号 '$version'，需要 SemVer 形式（如 1.1.0 或 1.1.0-beta.1）"
            exit 1
          fi
          echo "版本号：$version"

          # 下面这些文件里的版本必须与 tag 完全一致。
          # 用 node 解析而不是 sed/grep：JSON 与 TOML 的写法不同，正则很容易匹配到空字符串
          # 然后「悄悄地通过」，这里一旦取不到值就直接判失败。
          fail=0
          json_version() {
            if [ ! -f "$1" ]; then echo "::error::找不到文件 $1"; exit 1; fi
            node -e 'const v = require(require("node:path").resolve(process.argv[1])).version; if (v === undefined) process.exit(1); console.log(v)' "$1"
          }
          toml_version() { sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -n1; }

          check() {
            actual="$2"
            if [ -z "$actual" ] || [ "$actual" = "undefined" ]; then
              echo "::error file=$1::无法从 $1 中读出版本号"
              fail=1
            elif [ "$actual" != "$version" ]; then
              echo "::error file=$1::$1 里的版本是 '$actual'，但发布 tag 是 '$version'，请先同步版本号再打 tag"
              fail=1
            fi
          }
          check Cargo.toml "$(toml_version Cargo.toml)"
          check src-tauri/Cargo.toml "$(toml_version src-tauri/Cargo.toml)"
          check package.json "$(json_version package.json)"
          check ui/package.json "$(json_version ui/package.json)"
          check src-tauri/tauri.conf.json "$(json_version src-tauri/tauri.conf.json)"
          [ "$fail" -eq 0 ] || exit 1

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # ── 2. CLI 二进制（不需要 webkit，根包 default-members 就是它）──────────
  cli:
    name: CLI ${{ matrix.target }}
    needs: versioning
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, archive: tar.xz }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.xz }
          - { runner: macos-latest, target: aarch64-apple-darwin, archive: tar.xz }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, archive: tar.xz }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: 编译（dist profile）
        run: cargo build --profile dist --locked --target ${{ matrix.target }} --bin ${{ env.CLI_BIN }}

      # 统一用 bash：Windows runner 自带 Git Bash，且 Glob 行为与 Linux 一致
      - name: 打包
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          bin="target/${TARGET}/dist/${CLI_BIN}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="${bin}.exe"
          fi

          name="${CLI_BIN}-${TARGET}"
          if [ "$EXT" = "zip" ]; then
            # Windows runner 上的 7z 由 Git for Windows / runner 镜像提供
            7z a -bso0 -bsp0 "${name}.zip" "$bin"
          else
            tar -cJf "${name}.tar.xz" "$bin"
          fi
          ls -lh "${name}.${EXT}"

      - name: 生成 SHA256
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync } = require("node:fs");
            const [name, ext] = process.argv.slice(1);
            const file = `${name}.${ext}`;
            const hash = createHash("sha256").update(readFileSync(file)).digest("hex");
            writeFileSync(`${file}.sha256`, `${hash}  ${file}\n`);
          ' "${CLI_BIN}-${TARGET}" "${EXT}"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.CLI_BIN }}-${{ matrix.target }}.${{ matrix.archive }}
            ${{ env.CLI_BIN }}-${{ matrix.target }}.${{ matrix.archive }}.sha256

  # ── 3. Tauri 桌面端安装包 ──────────────────────────────────────────────
  desktop:
    name: Desktop ${{ matrix.target }}
    needs: versioning
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # path 用 **/ 通配：带 --target 构建时产物在 target/<triple>/release/bundle/，
        # 不带时在 target/release/bundle/，通配两种布局都命中。
        # 这里只列真正的安装包，不用整个 bundle/ 目录——.deb 会解包出中间目录，
        # 传目录会把 data.tar.gz 之类的中间文件一起塞进 artifacts。
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            path: |
              **/release/bundle/deb/*.deb
              **/release/bundle/appimage/*.AppImage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            path: |
              **/release/bundle/deb/*.deb
              **/release/bundle/appimage/*.AppImage
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            # 不含 .app 目录：内含符号链接，且压缩后拿到手也无法直接双击运行
            path: "**/release/bundle/dmg/*.dmg"
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            path: |
              **/release/bundle/msi/*.msi
              **/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # webkit2gtk-4.1 是 Tauri 在 Linux 上的硬依赖；只跑 CLI 的机器不需要这些
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 目前每个 runner 都编自己原生的架构，不需要交叉编译工具链。
      # 若以后要在 amd64 runner 上编 aarch64（或反之），除 gcc 交叉工具链外还必须准备
      # 目标架构的 webkit2gtk-4.1（pkg-config 找不到就会在 webkit2gtk-sys 处失败），
      # 交叉编译桌面端基本得不偿失，建议继续用对应架构的 runner。

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          workspaces: src-tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # 用 npm ci 严格按 lockfile 安装；Tauri CLI 在根 devDependencies 里
      - name: 安装前端依赖
        run: npm ci

      # src-tauri/gen/schemas 是 cargo 编译 tauri-build 时自动生成的，这里不需要预先触碰。
      # （原先是 `npx tauri build --help > /dev/null`，在 Windows 的 PowerShell 下 /dev/null
      #  会被当成路径 D:\dev\null 而失败；只做环境自检的话用下面这条。）
      - name: 环境自检
        run: npx tauri --version

      # beforeBuildCommand (npm run build) 会先构建前端，再由 tauri 打包安装包
      - name: 打包桌面端
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ runner.os == 'Linux' && '--no-sign' || '' }}

      # 注意产物路径带目标三元组：用 --target 构建时装到 target/<triple>/release/bundle，
      # 只有不带 --target 的原地构建才是 target/release/bundle（这里早期写错，CI 上直接找不到目录）。
      # 用 node 而不是 sha256sum：macOS runner 默认没有 sha256sum（那是 GNU coreutils），
      # Windows 的 Git Bash 同样没有。
      - name: 生成 SHA256
        shell: bash
        env:
          BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
          SUMS: SHA256SUMS-desktop-${{ matrix.target }}.txt
        run: |
          set -euo pipefail
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::找不到 $BUNDLE_DIR，桌面端打包可能没有产出安装包"
            exit 1
          fi
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync, readdirSync, statSync } = require("node:fs");
            const { join, relative, sep } = require("node:path");
            const [dir, out] = process.argv.slice(1);
            const ext = /\.(deb|AppImage|dmg|msi|exe)$/;
            const walk = (d) => readdirSync(d, { withFileTypes: true }).flatMap((e) => {
              const p = join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            // 只取真正的安装包；bundle/ 下还有 .deb 解包出来的中间目录（data.tar.gz 等）
            const files = walk(dir).filter((f) => ext.test(f) && statSync(f).isFile()).sort();
            if (files.length === 0) {
              console.error(`在 ${dir} 下没找到任何安装包（.deb/.AppImage/.dmg/.msi/.exe）`);
              process.exit(1);
            }
            const lines = files.map((f) => {
              const hash = createHash("sha256").update(readFileSync(f)).digest("hex");
              return `${hash}  ${relative(dir, f).split(sep).join("/")}`;
            });
            writeFileSync(out, lines.join("\n") + "\n");
            process.stdout.write(lines.join("\n") + "\n");
          ' "$BUNDLE_DIR" "$SUMS"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ matrix.path }}
            SHA256SUMS-desktop-${{ matrix.target }}.txt

  # ── 4. 汇总所有产物，创建唯一一个 GitHub Release ───────────────────────
  publish:
    needs:
      - versioning
      - cli
      - desktop
    if: ${{ always() && needs.versioning.outputs.publish == 'true' && needs.versioning.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.versioning.outputs.version }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.versioning.outputs.prerelease }}
      CLI_RESULT: ${{ needs.cli.result }}
      DESKTOP_RESULT: ${{ needs.desktop.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 需要完整历史与全部 tag：下面用 `git tag` 找上一个版本来生成 compare 链接
          fetch-depth: 0
          persist-credentials: false

      # 先把所有平台的产物下载到临时目录，下一步再挑出真正的发布文件摊平到 release/
      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: downloads
          merge-multiple: true
          # 某个平台的产物缺失时立刻失败，而不是发一个静默缺文件的 Release
          if-no-files-found: error

      # 只把「真正的发布文件」复制到 release/，其余一律丢弃。
      #
      # 踩过的坑：直接 `gh release create dist/*` 时，下载目录里混进了一个 target/ 目录
      # （来自某个 artifact 内部的相对路径结构），gh 把它当资产去读，报
      # `read dist/target: is a directory` 整步失败。
      # 这里改成「白名单 + 摊平 + 体积校验 + 纯文件断言」，任何目录或构建中间产物都进不来。
      - name: 整理发布文件
        shell: bash
        env:
          DOWNLOADS: downloads
          RELEASE_DIR: release
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"

          # 白名单：安装包、CLI 压缩包、各平台校验清单。
          # 不管混进来的是 target/ 还是平台子目录，这里全部摊平成一层。
          find "$DOWNLOADS" -mindepth 1 -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.tar.xz' -o -name '*.zip' -o -name '*.sha256' -o -name 'SHA256SUMS*.txt' \) \
            -exec cp -t "$RELEASE_DIR" {} +
          echo "白名单命中 $(ls -1A "$RELEASE_DIR" | wc -l) 个文件"

          # 体积校验：真实产物最小也有几 MB（CLI 二进制约 2-5MB），远小于此值说明混进了
          # 文本/中间产物；上限用来拦住被误打包的构建目录。
          # 校验清单（.sha256 / SHA256SUMS*.txt）本身就是几十字节的文本，单独用更低的下限。
          node -e '
            const { readdirSync, statSync, unlinkSync } = require("node:fs");
            const { join } = require("node:path");
            const dir = process.argv[1];
            const isSum = (f) => /\.sha256$/.test(f) || /^SHA256SUMS.*\.txt$/.test(f);
            const BIN_MIN = 64 * 1024;
            const SUM_MIN = 8;
            const MAX = 2 * 1024 * 1024 * 1024;
            let bad = 0;
            for (const f of readdirSync(dir)) {
              const p = join(dir, f);
              if (!statSync(p).isFile()) { console.error(`  ✗ 非普通文件，剔除：${f}`); unlinkSync(p); bad++; continue; }
              const size = statSync(p).size;
              const min = isSum(f) ? SUM_MIN : BIN_MIN;
              if (size < min || size > MAX) {
                console.error(`  ✗ 体积异常，剔除：${f} (${size} 字节)`);
                unlinkSync(p);
                bad++;
              }
            }
            console.log(bad === 0 ? "体积校验通过" : `剔除了 ${bad} 个异常文件`);
          ' "$RELEASE_DIR"

          # 最后断言：release/ 下只能有普通文件（这正是 gh 报 is a directory 的那类情况）
          while IFS= read -r -d '' entry; do
            if [ ! -f "$entry" ]; then
              echo "::error::$entry 不是普通文件，拒绝继续"
              exit 1
            fi
          done < <(find "$RELEASE_DIR" -mindepth 1 -print0)

          if [ -z "$(ls -A "$RELEASE_DIR")" ]; then
            echo "::error::没有任何可发布的文件，构建产物可能没有正确上传"
            exit 1
          fi

          echo "--- 待发布文件 ---"
          ls -lh "$RELEASE_DIR"

      - name: 生成 SHA256SUMS.txt
        shell: bash
        env:
          RELEASE_DIR: release
        run: |
          set -euo pipefail
          # 各平台单独的清单没有发布价值（汇总清单才是权威），删掉避免混淆
          rm -f "$RELEASE_DIR"/SHA256SUMS-desktop-*.txt
          cd "$RELEASE_DIR"
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | tee SHA256SUMS.txt

      # 找出上一个 tag 用于生成 compare 链接；没有（首次发布）或查不到时退化成当前 tag
      - name: 查找上一个 tag
        id: prev
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git tag --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)"
          if [ -z "$prev" ]; then
            echo "没有更早的 tag，compare 链接退化为本 tag"
            prev="$TAG"
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

      - name: 生成 Release 说明
        shell: bash
        env:
          PREV_TAG: ${{ steps.prev.outputs.prev }}
        run: |
          set -euo pipefail
          {
            echo "Rime 输入法每日字数统计 **v${VERSION}**。"
            echo
            echo "本版本同时发布桌面端安装包与命令行二进制，两者共用同一套统计逻辑。"
            echo
            if [ "$CLI_RESULT" != "success" ] || [ "$DESKTOP_RESULT" != "success" ]; then
              echo "> [!WARNING]"
              echo "> 本次构建未完全成功（CLI: \`${CLI_RESULT}\` / 桌面端: \`${DESKTOP_RESULT}\`），下方缺失的产物请等待重跑。"
              echo
            fi
            echo "## 桌面端（默认产品形态）"
            echo
            echo "| 系统 | 安装包 |"
            echo "| --- | --- |"
            echo "| Linux x86_64 | \`.deb\` / \`.AppImage\`（Ubuntu 24.04 构建，需 glibc ≥ 2.39） |"
            echo "| Linux aarch64 | \`.deb\` / \`.AppImage\` |"
            echo "| macOS (Apple Silicon) | \`.dmg\` |"
            echo "| Windows x64 | \`.msi\` / \`-setup.exe\`（NSIS） |"
            echo
            echo "## 命令行（cron 用）"
            echo
            echo "\`rime-word-counter-<平台>.tar.xz\` / \`.zip\`，解压后得到单个可执行文件；"
            echo "使用 \`--process\` 汇总日志、\`--stats\` 查看统计。"
            echo
            echo "## 安装说明"
            echo
            echo "- **macOS**：安装包未签名、未公证。首次打开若提示「已损坏」或「无法验证开发者」，执行"
            printf '  `xattr -dr com.apple.quarantine "/Applications/Rime Word Counter.app"`，\n'
            echo "  或在「系统设置 → 隐私与安全性」里点「仍要打开」。"
            echo "- **Windows**：SmartScreen 会拦截未签名安装包，点「更多信息 → 仍要运行」。"
            echo "- **Linux**：\`sudo dpkg -i *.deb\`，或 \`chmod +x *.AppImage && ./*.AppImage\`。"
            echo "- 所有产物均为未签名构建；可用下方的 \`SHA256SUMS.txt\` 校验完整性。"
            echo
            echo "<details><summary>SHA256 校验值</summary>"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
            echo "</details>"
            echo
            # 与上一个 tag 做对比；首个 release 没有上一个 tag，此时退化成只指向本 tag
            echo "**完整变更**：https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          } > "$RUNNER_TEMP/notes.md"

      - name: 创建 Release 并上传产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIR: release
        run: |
          set -euo pipefail
          # 用数组显式列举文件，不再用 release/* 通配——通配会把混进来的目录交给 gh，
          # 报 `read ...: is a directory` 整步失败（已踩过）。
          shopt -s nullglob
          assets=("$RELEASE_DIR"/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::$RELEASE_DIR 下没有可上传的文件"
            exit 1
          fi
          for a in "${assets[@]}"; do
            if [ ! -f "$a" ]; then
              echo "::error::$a 不是普通文件，拒绝上传"
              exit 1
            fi
          done
          echo "将上传 ${#assets[@]} 个文件："
          printf '  %s\n' "${assets[@]}"

          # 合并到已存在的 Release（常用于重跑），否则新建
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=()
            # 注意：set -e 下必须用 if 而不是 `[ ... ] && ...`，否则条件为假时整步会退出
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${flags[@]}" \
              "${assets[@]}"
          fi
          gh release view "$TAG" --json url --jq .url
