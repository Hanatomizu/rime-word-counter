[package]
name = "rime-word-counter"
version = "1.0.0-r2"
edition = "2021"
description = "Rime 输入法字数统计与可视化工具"
authors = ["hanatomizu"]
repository = "https://github.com/Hanatomizu/rime-word-counter"

[package.metadata.wix]
upgrade-guid = "3ECCD00C-9887-48A8-98E3-63274F112D33"
path-guid = "35C32B62-9455-4607-96E4-902AEA99EF25"
license = false
eula = false

[dependencies]
# CLI 参数解析
clap = { version = "4", features = ["derive"] }
# SQLite 嵌入式数据库（bundled 内嵌 SQLite，无需系统安装）
rusqlite = { version = "0.32", features = ["bundled"] }
# 日期解析与格式化
chrono = "0.4"
# 图表生成（PNG 后端 + 内存渲染）
plotters = "0.3"
# 错误处理
anyhow = "1"
# 获取平台标准目录（缓存目录等）
dirs = "5"
# GUI 框架（egui）
eframe = "0.31"
egui = "0.31"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
